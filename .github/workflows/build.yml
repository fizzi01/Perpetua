name: Build

on:
  workflow_dispatch:
    inputs:
      update-release:
        description: "Upload build assets to a release"
        type: boolean
        default: false
      release-tag:
        description: "Release tag to update. Use alpha for the pre-release; empty uses the latest release."
        type: string
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  build-desktop:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: macOS-arm64
            rust-target: aarch64-apple-darwin
            gui-exe-name: perpetua
            build-output: .build/aarch64-apple-darwin/release
            archive-name: Perpetua-macOS
            archive-ext: zip
          - os: macos-15-intel
            platform: macOS-x86_64
            rust-target: x86_64-apple-darwin
            gui-exe-name: perpetua
            build-output: .build/x86_64-apple-darwin/release
            archive-name: Perpetua-macOS_15-Intel
            archive-ext: zip
          - os: macos-15
            platform: macOS_15-arm64
            rust-target: aarch64-apple-darwin
            gui-exe-name: perpetua
            build-output: .build/aarch64-apple-darwin/release
            archive-name: Perpetua-macOS_15
            archive-ext: zip
          - os: windows-latest
            platform: Windows-x86_64
            rust-target: x86_64-pc-windows-msvc
            gui-exe-name: perpetua.exe
            build-output: .build/x86_64-pc-windows-msvc/release
            archive-name: Perpetua-Windows-x86_64
            archive-ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Poetry
        run: pipx install poetry

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install automake autoconf libtool ccache

      - name: Install Python dependencies
        run: poetry install --only main,build --no-interaction -v

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-gui/src-tauri -> target
          shared-key: build-${{ matrix.platform }}

      - name: Cache Tauri CLI
        id: cache-tauri-cli
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-${{ matrix.platform }}-v2

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Install npm dependencies
        working-directory: src-gui
        run: npm install

      - name: Build GUI
        working-directory: src-gui
        run: cargo tauri build --target ${{ matrix.rust-target }}

      - name: Decode and import certificate
        if: runner.os == 'macOS'
        env:
          MAC_CERTIFICATE: ${{ secrets.CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          echo "$MAC_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p $KEYCHAIN_PASSWORD build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          rm certificate.p12
          # The signing identity (certificate common-name) is provided explicitly
          # via the MACOS_SIGN_IDENTITY secret and handed to build.py's codesign
          # step (see _sign_bundle). We do NOT derive it from `find-identity -v`:
          # a self-signed cert is untrusted in the ephemeral CI keychain, so `-v`
          # lists 0 valid identities, the derived value is empty, and build.py
          # silently falls back to an ad-hoc signature. Ad-hoc bundles bind macOS
          # TCC (Accessibility) grants to the cdhash, which changes every build,
          # so users must re-grant permissions on every release. `codesign --sign
          # <name>` finds the identity by name even when untrusted.
          if [ -z "$MACOS_SIGN_IDENTITY" ]; then
            echo "::error::MACOS_SIGN_IDENTITY secret is empty; refusing to build a release that would sign ad-hoc"
            exit 1
          fi
          echo "PERPETUA_MACOS_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Build daemon
        run: poetry run python build.py --skip-gui --gui-external --nuitka-args --assume-yes-for-downloads

      - name: Clean Nuitka build cache
        run: find ${{ matrix.build-output }} -maxdepth 1 -name '*.build' -type d -exec rm -rf {} +
        shell: bash

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x ${{ matrix.build-output }}/Perpetua.app/Contents/MacOS/Perpetua
          chmod +x ${{ matrix.build-output }}/Perpetua.app/Contents/MacOS/_perpetua
          ditto -c -k --sequesterRsrc --keepParent ${{ matrix.build-output }}/Perpetua.app ${{ matrix.build-output }}/${{ matrix.archive-name }}.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = Get-ChildItem -Path "${{ matrix.build-output }}" -Filter "*.dist" -Directory
          if ($dist) {
            Rename-Item -Path $dist.FullName -NewName "Perpetua"
          }
          Compress-Archive -Path "${{ matrix.build-output }}/Perpetua" -DestinationPath "${{ matrix.build-output }}/${{ matrix.archive-name }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.archive-name }}
          path: ${{ matrix.build-output }}/${{ matrix.archive-name }}.${{ matrix.archive-ext }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux build inside ubuntu:24.04 container.
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build (Linux-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:24.04
      # /tmp is shared by default; nothing else is needed.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            build-output: .build/x86_64-unknown-linux-gnu/release
            archive-name: Perpetua-Linux-x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            build-output: .build/aarch64-unknown-linux-gnu/release
            archive-name: Perpetua-Linux-aarch64

    env:
      DEBIAN_FRONTEND: noninteractive
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup

    steps:
      - name: Prepare container (toolchain + build deps)
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget gnupg git file sudo \
            build-essential pkg-config \
            libssl-dev libtiff-dev libgtk-3-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            automake libtool fakeroot patchelf \
            python3.12 python3.12-venv python3.12-dev python3-pip pipx \
            libei1 liboeffis1 kbd
          # Build deps: make_appimage.sh copies them into the bundle. Nothing
          # links against them, so the -dev packages don't pull them in.
          # Node ${{ env.NODE_VERSION }} from NodeSource (the apt default is
          # too old for the Tauri JS toolchain we use).
          curl -fsSL https://deb.nodesource.com/setup_${{ env.NODE_VERSION }}.x | bash -
          apt-get install -y --no-install-recommends nodejs
          # actions/checkout drops the workspace owned by the host runner UID;
          # tell git not to complain when we touch it as root in the container.
          git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Poetry
        run: |
          pipx install poetry
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal \
                       --target ${{ matrix.rust-target }}
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-gui/src-tauri -> target
          shared-key: build-Linux-${{ matrix.arch }}

      - name: Cache Tauri CLI
        id: cache-tauri-cli
        uses: actions/cache@v5
        with:
          path: ${{ env.CARGO_HOME }}/bin/cargo-tauri
          key: tauri-cli-Linux-${{ matrix.arch }}-v2

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Install Python dependencies
        run: poetry install --only main,build --no-interaction -v

      - name: Install npm dependencies
        working-directory: src-gui
        run: npm install

      - name: Build GUI
        working-directory: src-gui
        run: cargo tauri build --target ${{ matrix.rust-target }}

      - name: Build daemon
        run: poetry run python build.py --skip-gui --gui-external --nuitka-args --assume-yes-for-downloads

      - name: Clean Nuitka build cache
        run: find ${{ matrix.build-output }} -maxdepth 1 -name '*.build' -type d -exec rm -rf {} +

      - name: Package (.deb + AppImage)
        run: |
          set -eux
          chmod +x ${{ matrix.build-output }}/Perpetua.dist/Perpetua
          chmod +x ${{ matrix.build-output }}/Perpetua.dist/_perpetua
          bash scripts/make_deb.sh
          bash scripts/make_appimage.sh
          cp .build/perpetua_*.deb "${{ matrix.build-output }}/${{ matrix.archive-name }}.deb"
          # Keep make_appimage.sh's name: the AppImage catalog requires
          # Name-Version-arch.AppImage.
          cp .build/Perpetua-*.AppImage "${{ matrix.build-output }}/"

      - name: Upload .deb
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.archive-name }}-deb
          path: ${{ matrix.build-output }}/${{ matrix.archive-name }}.deb
          if-no-files-found: error

      - name: Upload .AppImage
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.archive-name }}-appimage
          path: ${{ matrix.build-output }}/Perpetua-*.AppImage
          if-no-files-found: error

      - name: Upload Nuitka dist (input for RPM packaging)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.archive-name }}-dist
          path: ${{ matrix.build-output }}/Perpetua.dist
          if-no-files-found: error
          # The dist is large (>200 MB) and only feeds the RPM job; nothing
          # external should depend on it.
          retention-days: 3
  build-linux-rpm:
    name: Package RPM (Linux-${{ matrix.arch }})
    needs: build-linux
    runs-on: ${{ matrix.runner }}
    container:
      image: fedora:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            build-output: .build/x86_64-unknown-linux-gnu/release
            archive-name: Perpetua-Linux-x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            build-output: .build/aarch64-unknown-linux-gnu/release
            archive-name: Perpetua-Linux-aarch64

    steps:
      - name: Prepare container
        run: |
          set -eux
          dnf install -y --setopt=install_weak_deps=False \
            git rpm-build tar gzip findutils which
          git config --global --add safe.directory '*'

      - name: Checkout (for scripts/ and pyproject.toml)
        uses: actions/checkout@v6

      - name: Download Nuitka dist from build-linux
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.archive-name }}-dist
          path: ${{ matrix.build-output }}/Perpetua.dist

      - name: Build RPM
        run: |
          set -eux
          chmod +x ${{ matrix.build-output }}/Perpetua.dist/Perpetua
          chmod +x ${{ matrix.build-output }}/Perpetua.dist/_perpetua
          bash scripts/make_rpm.sh
          mkdir -p artifacts
          cp .build/perpetua-*.rpm "artifacts/${{ matrix.archive-name }}.rpm"

      - name: Upload .rpm
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.archive-name }}-rpm
          path: artifacts/${{ matrix.archive-name }}.rpm
          if-no-files-found: error
  smoke-test-linux:
    name: Smoke (${{ matrix.label }})
    needs: [build-linux, build-linux-rpm]
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: deb-ubuntu-24.04
            container: ubuntu:24.04
            kind: deb
            install: apt-get update && apt-get install -y --no-install-recommends ./pkg.deb
          - label: deb-debian-trixie
            container: debian:trixie-slim
            kind: deb
            install: apt-get update && apt-get install -y --no-install-recommends ./pkg.deb
          - label: rpm-fedora
            container: fedora:latest
            kind: rpm
            install: dnf install -y ./pkg.rpm
          # Three distros: "portable" is the claim under test.
          - label: appimage-ubuntu-24.04
            container: ubuntu:24.04
            kind: appimage
            install: ":"
          - label: appimage-fedora
            container: fedora:latest
            kind: appimage
            install: ":"
          - label: appimage-archlinux
            container: archlinux:latest
            kind: appimage
            install: ":"

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Prepare container
        # deb/rpm pull their runtime libs through their own Depends/Requires,
        # which is part of what this job verifies.
        #
        # For the AppImage install ONLY what the excludelist says every host
        # provides, plus Xvfb. Installing gtk3/webkit2gtk/libei here would
        # make the test tautological. libGLESv2 is in the list though absent
        # from the excludelist: libglvnd dlopens it, and shipping ours beside
        # the host's libGLdispatch is the ABI split the excludelist prevents.
        run: |
          set -eux
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates file libc-bin git xvfb xauth
            if [ "${{ matrix.kind }}" = "appimage" ]; then
              apt-get install -y --no-install-recommends \
                libgl1 libegl1 libgles2 libglx-mesa0 libfontconfig1 \
                libfreetype6 libharfbuzz0b libwayland-client0 libx11-6 \
                libxext6 libxrender1 zlib1g
            fi
          elif command -v dnf >/dev/null; then
            dnf install -y file glibc git xorg-x11-server-Xvfb xorg-x11-xauth
            if [ "${{ matrix.kind }}" = "appimage" ]; then
              dnf install -y mesa-libGL libglvnd-egl libglvnd-gles \
                fontconfig freetype harfbuzz libwayland-client libX11 \
                libXext libXrender zlib
            fi
          elif command -v pacman >/dev/null; then
            pacman -Syu --noconfirm file glibc git xorg-server-xvfb xorg-xauth
            if [ "${{ matrix.kind }}" = "appimage" ]; then
              pacman -S --noconfirm libglvnd fontconfig freetype2 harfbuzz \
                wayland libx11 libxext libxrender zlib
            fi
          fi
          git config --global --add safe.directory '*'

      - name: Checkout (for the excludelist)
        uses: actions/checkout@v6

      - name: Download artifact
        # x86_64 runners only; aarch64 artifacts are released untested here.
        # Cover them with scripts/verify_packages.sh --arch aarch64.
        uses: actions/download-artifact@v7
        with:
          name: Perpetua-Linux-x86_64-${{ matrix.kind }}
          path: artifacts

      - name: Stage package as ./pkg.${{ matrix.kind }}
        run: |
          set -eux
          case "${{ matrix.kind }}" in
            deb)      cp artifacts/*.deb      pkg.deb ;;
            rpm)      cp artifacts/*.rpm      pkg.rpm ;;
            appimage) cp artifacts/*.AppImage pkg.AppImage ;;
          esac
          ls -la pkg.*

      - name: Install package
        if: matrix.kind != 'appimage'
        run: ${{ matrix.install }}

      - name: Verify every bundled ELF resolves its libraries
        shell: bash
        run: |
          set -eu
          if [ "${{ matrix.kind }}" = "appimage" ]; then
            chmod +x pkg.AppImage
            # FUSE may be unavailable in the container; --appimage-extract
            # works without it.
            ./pkg.AppImage --appimage-extract >/dev/null
            ROOT=squashfs-root
          else
            ROOT=/opt/Perpetua
          fi

          # Scan every ELF, not just the two binaries: any Nuitka extension
          # or WebKit helper can be the one that fails to load. Excludelist
          # sonames may be missing here - this is a bare container.
          : > unresolved.txt
          while IFS= read -r f; do
            [ "$(head -c4 "$f" | od -An -tx1 | tr -d ' \n')" = "7f454c46" ] || continue
            for soname in $(ldd "$f" 2>/dev/null | awk '/not found/ {print $1}'); do
              grep -qx -- "$soname" scripts/appimage-excludelist.txt && continue
              echo "$f: $soname" >> unresolved.txt
            done
          done < <(find "$ROOT" -type f)

          if [ -s unresolved.txt ]; then
            sort -u -o unresolved.txt unresolved.txt
            while read -r line; do
              echo "::error::unresolved on ${{ matrix.label }}: $line"
            done < unresolved.txt
            exit 1
          fi
          echo "OK: all non-excludelist libs resolved on ${{ matrix.label }}"

      - name: Verify dlopen'd libraries and helper binaries are present
        # Invisible to ldd, and running the app can't catch them either: the
        # daemon is a child whose stderr never reaches us. Hence a manifest
        # check, with the list written here rather than read from
        # make_appimage.sh - a test must not source its own expectations.
        if: matrix.kind == 'appimage'
        shell: bash
        run: |
          set -eu
          BUNDLE=squashfs-root/usr/lib/Perpetua
          fail=0
          for soname in libei.so.1 liboeffis.so.1 libayatana-appindicator3.so.1; do
            if [ ! -f "$BUNDLE/$soname" ]; then
              echo "::error::$soname is dlopen'd at runtime but not bundled"
              fail=1
            elif ldd "$BUNDLE/$soname" 2>&1 | grep -q 'not found'; then
              echo "::error::$soname is bundled but does not resolve"
              ldd "$BUNDLE/$soname" || true
              fail=1
            fi
          done
          for exe in dumpkeys; do
            if [ ! -x "$BUNDLE/$exe" ]; then
              echo "::error::$exe is executed by pynput but not bundled"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "OK: dlopen'd libraries and helper binaries present"

      - name: Launch
        # Catches what static inspection cannot: a bundle that is complete on
        # paper but does not run.
        shell: bash
        run: |
          set -eu
          if [ "${{ matrix.kind }}" = "appimage" ]; then
            TARGET=squashfs-root/AppRun
          else
            TARGET=/opt/Perpetua/Perpetua
          fi
          set +e
          timeout --signal=TERM 30 xvfb-run -a "$TARGET" > launch.log 2>&1
          rc=$?
          set -e
          echo "--- launch log ---"
          cat launch.log || true
          echo "------------------"
          # 124 = still running at the timeout, i.e. healthy.
          if [ "$rc" -ne 124 ]; then
            echo "::error::Perpetua exited with $rc on ${{ matrix.label }}"
            exit 1
          fi
          for marker in "cannot open shared object file" "is not installed" "Backend import failed"; do
            if grep -qi "$marker" launch.log; then
              echo "::error::Missing runtime dependency on ${{ matrix.label }}: $marker"
              exit 1
            fi
          done
          echo "OK: launched and stayed up on ${{ matrix.label }}"
  update-release:
    name: Update Release
    if: github.event_name == 'release' || inputs.update-release
    needs: [build-desktop, build-linux, build-linux-rpm, smoke-test-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: Perpetua-*
          path: artifacts
          merge-multiple: true

      - name: Resolve release tag
        id: release-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RELEASE_TAG: ${{ inputs.release-tag }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          if [ -n "$EVENT_RELEASE_TAG" ]; then
            tag="$EVENT_RELEASE_TAG"
          elif [ -n "$INPUT_RELEASE_TAG" ]; then
            tag="$INPUT_RELEASE_TAG"
          else
            tag="$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          files: |
            artifacts/*.zip
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.AppImage
