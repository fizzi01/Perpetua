name: Tests

on:
  push:
    branches:
      - master
      - ci
  pull_request:
    branches:
      - master

jobs:
  should_run_tests:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.filter.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.after || github.event.pull_request.head.sha || github.sha }}

      - id: filter
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after || github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          run_tests=true
          null_sha="0000000000000000000000000000000000000000"

          if [[ "$ACTOR" == "github-actions[bot]" ]]; then
            run_tests=false
          fi

          if [[ "$EVENT_NAME" == "pull_request" && "$PR_TITLE" =~ ^(chore|docs|ci) ]]; then
            run_tests=false
          fi

          if [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "$null_sha" && -n "$AFTER_SHA" ]] &&
            git cat-file -e "$BEFORE_SHA^{commit}" &&
            git cat-file -e "$AFTER_SHA^{commit}"; then
            commit_log_command=(git log --format=%s "$BEFORE_SHA..$AFTER_SHA")
          else
            commit_log_command=(git log -1 --format=%s "${AFTER_SHA:-HEAD}")
          fi

          saw_commit=false
          has_testable_commit=false
          while IFS= read -r commit_subject; do
            saw_commit=true
            if [[ ! "$commit_subject" =~ ^(chore|docs|ci) && "$commit_subject" != *"(gui)"* ]]; then
              has_testable_commit=true
              break
            fi
          done < <("${commit_log_command[@]}")

          if [[ "$saw_commit" == false || "$has_testable_commit" == false ]]; then
            run_tests=false
          fi

          echo "run_tests=$run_tests" >> "$GITHUB_OUTPUT"

  test:
    needs: should_run_tests
    if: needs.should_run_tests.outputs.run_tests == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
        #- "3.11"
        - "3.12"
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 50
        submodules: true

    - name: Install poetry
      run: pipx install poetry

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: poetry

    - name: Install macOS dependencies
      if: matrix.os == 'macos-latest'
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
      run: |
        brew install gnu-sed libtool autoconf automake

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libtiff-dev \
          libgtk-3-dev \
          automake \
          libtool \
          libwebkit2gtk-4.1-dev \
          build-essential \
          curl \
          wget \
          file \
          libxdo-dev \
          libssl-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          fakeroot

    - name: Install Python Deps
      run: |
        poetry install --only main,test --no-interaction

    - name: Test
      run: |
        poetry run pytest -vv
